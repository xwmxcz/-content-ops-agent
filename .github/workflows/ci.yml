name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  lint:
    name: Lint & typecheck (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt
      - run: pip install -r requirements.lock -r requirements-dev.txt
      - run: ruff check . --output-format=github
      - run: ruff format --check .
      - run: mypy

  test-backend:
    name: Backend tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: content_ops
          POSTGRES_PASSWORD: content_ops
          POSTGRES_DB: content_ops_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U content_ops -d content_ops_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://content_ops:content_ops@127.0.0.1:5432/content_ops_test
      # Turn "skip because no DB" into a hard failure so the suite can never go
      # half-green: see tests/conftest.py.
      REQUIRE_TEST_DATABASE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock
      - name: Run pytest
        run: python -m pytest -q --junitxml=pytest-report.xml
      - name: Verify migrations are in sync with ORM metadata
        env:
          APP_ENV: test
          AUTH_SECRET_KEY: ci-signing-key-with-at-least-32-characters-long
          DATABASE_URL: postgresql+psycopg://content_ops:content_ops@127.0.0.1:5432/content_ops_test
          SCHEMA_MANAGEMENT: migrate
        run: |
          alembic upgrade head
          alembic check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-report
          path: pytest-report.xml

  test-frontend:
    name: Frontend typecheck & unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx vue-tsc --noEmit
      # jsdom boots slowly on cold CI runners; the first local run timed out
      # during environment setup. Give the pool a longer ceiling than the
      # vitest default so a slow runner cannot look like a real failure.
      - run: npx vitest run --testTimeout=20000 --hookTimeout=20000
      - run: npm run build

  docker-build:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [lint, test-backend, test-frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          push: false
          # CI runners have direct upstream access; override the China-mirror defaults.
          build-args: |
            APT_MIRROR=http://deb.debian.org
            PIP_INDEX_URL=https://pypi.org/simple
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: frontend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    # Blocking for the *production* dependency surface, advisory for dev tooling.
    # A new upstream CVE in a dev-only package should be visible without
    # blocking an unrelated merge, but a vulnerability in something that ships
    # to users (or into the image) must fail the build.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python dependencies (blocking)
        run: |
          pip install pip-audit
          pip-audit -r requirements.lock --strict
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Frontend production dependencies (blocking)
        working-directory: frontend
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
      - name: Frontend full audit, dev tooling included (advisory)
        continue-on-error: true
        working-directory: frontend
        run: npm audit --audit-level=high
