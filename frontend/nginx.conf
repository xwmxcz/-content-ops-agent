# Preserve an external TLS proxy's scheme only when the request reached this
# loopback-bound container through a host/private-network proxy. Untrusted
# sources cannot turn plain HTTP into HTTPS by supplying X-Forwarded-Proto.
geo $trusted_forwarding_proxy {
    default         0;
    127.0.0.1/32    1;
    ::1             1;
    172.16.0.0/12   1;
}
map "$trusted_forwarding_proxy:$http_x_forwarded_proto" $origin_proto {
    ~*^1:https$ https;
    default     $scheme;
}

# The container is a production edge and never supports URL credentials. Reject
# legacy ticket/bearer parameters before proxying so they cannot reach upstream
# diagnostics or error paths. Ordinary query parameters (for example after_seq)
# remain available.
map $args $has_url_credential {
    default 0;
    ~*(^|&)(access_token|access_ticket)= 1;
}

# Deliberately log $uri rather than $request/$request_uri, and omit Referer,
# so access_ticket or other query credentials cannot enter the access log even
# when a client sends a sensitive URL as its referrer.
log_format sanitized '$remote_addr - $remote_user [$time_local] '
                     '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                     '"$http_user_agent"';
access_log /var/log/nginx/access.log sanitized;

server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        if ($has_url_credential) { return 400; }

        set $api_upstream http://api:8000;
        proxy_pass $api_upstream$uri$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $origin_proto;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
