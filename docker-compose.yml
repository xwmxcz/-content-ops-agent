x-app-env: &app-env
  APP_ENV: ${APP_ENV:-production}
  SCHEMA_MANAGEMENT: ${SCHEMA_MANAGEMENT:-validate}
  LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
  MOONSHOT_API_KEY: ${MOONSHOT_API_KEY:-}
  NEWAPI_API_KEY: ${NEWAPI_API_KEY:-}
  NEWAPI_BASE_URL: ${NEWAPI_BASE_URL:-}
  CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-3-5-sonnet-20241022}
  SILICONFLOW_MODEL: ${SILICONFLOW_MODEL:-zai-org/GLM-4.5-Air}
  DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
  MOONSHOT_MODEL: ${MOONSHOT_MODEL:-moonshot-v1-8k}
  NEWAPI_MODEL: ${NEWAPI_MODEL:-gpt-4o-mini}
  SILICONFLOW_BASE_URL: ${SILICONFLOW_BASE_URL:-https://api.siliconflow.cn/v1}
  DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
  MOONSHOT_BASE_URL: ${MOONSHOT_BASE_URL:-https://api.moonshot.cn/v1}
  MAX_TOKENS: ${MAX_TOKENS:-4096}
  TEMPERATURE: ${TEMPERATURE:-0.7}
  LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-120}
  CHAT_PLAN_ENABLED: ${CHAT_PLAN_ENABLED:-true}
  AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-}
  AUTH_TOKEN_EXPIRE_MINUTES: ${AUTH_TOKEN_EXPIRE_MINUTES:-1440}
  AUTH_RESOURCE_TICKET_SECONDS: ${AUTH_RESOURCE_TICKET_SECONDS:-45}
  AUTH_MEDIA_TICKET_SECONDS: ${AUTH_MEDIA_TICKET_SECONDS:-300}
  DATABASE_URL: postgresql+psycopg://content_ops:${POSTGRES_PASSWORD:-content_ops}@postgres:5432/content_ops
  DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
  DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
  DB_POOL_TIMEOUT_SECONDS: ${DB_POOL_TIMEOUT_SECONDS:-30}
  JOB_QUEUE_MODE: rq
  REDIS_URL: redis://:${REDIS_PASSWORD:-content_ops}@redis:6379/0
  JOB_QUEUE_NAME: ${JOB_QUEUE_NAME:-content_ops}
  JOB_TIMEOUT_SECONDS: ${JOB_TIMEOUT_SECONDS:-300}
  MAX_PROVIDER_INFLIGHT_JOBS: ${MAX_PROVIDER_INFLIGHT_JOBS:-8}
  # A worker that dies mid-job stops renewing its lease; the reaper service
  # requeues the job once the lease lapses. Keep the lease several heartbeats long.
  JOB_LEASE_DURATION_SECONDS: ${JOB_LEASE_DURATION_SECONDS:-300}
  JOB_HEARTBEAT_INTERVAL_SECONDS: ${JOB_HEARTBEAT_INTERVAL_SECONDS:-30}
  JOB_REAPER_INTERVAL_SECONDS: ${JOB_REAPER_INTERVAL_SECONDS:-60}
  JOB_REAPER_BATCH_SIZE: ${JOB_REAPER_BATCH_SIZE:-50}
  # SSE run streaming. The keepalive interval must stay well below the browser
  # client's staleness budget (45s), or a normal long-running step is reported as
  # a dead connection.
  SSE_KEEPALIVE_SECONDS: ${SSE_KEEPALIVE_SECONDS:-15}
  SSE_POLL_INTERVAL_SECONDS: ${SSE_POLL_INTERVAL_SECONDS:-0.4}
  SSE_STREAM_TIMEOUT_SECONDS: ${SSE_STREAM_TIMEOUT_SECONDS:-600}
  MEDIA_STORAGE_ROOT: /app/data/media
  MEDIA_MAX_IMAGE_COUNT: ${MEDIA_MAX_IMAGE_COUNT:-9}
  MEDIA_MAX_VIDEO_SIZE_MB: ${MEDIA_MAX_VIDEO_SIZE_MB:-512}
  WEB_SEARCH_PROVIDER: ${WEB_SEARCH_PROVIDER:-auto}
  SERPER_API_KEY: ${SERPER_API_KEY:-}
  TAVILY_API_KEY: ${TAVILY_API_KEY:-}
  BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
  SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-}
  XHS_MCP_ENABLED: ${XHS_MCP_ENABLED:-true}
  XHS_MCP_URL: ${XHS_MCP_URL:-http://host.docker.internal:18060/mcp}
  XHS_MCP_TIMEOUT_SECONDS: ${XHS_MCP_TIMEOUT_SECONDS:-120}
  MEMORY_ENABLED: ${MEMORY_ENABLED:-true}
  MEMORY_DIR: /app/data/memory
  MEMORY_MD_LIMIT: ${MEMORY_MD_LIMIT:-2200}
  USER_MD_LIMIT: ${USER_MD_LIMIT:-1375}
  CONTEXT_COMPRESS_ENABLED: ${CONTEXT_COMPRESS_ENABLED:-true}
  CONTEXT_COMPRESS_TRIGGER_MESSAGES: ${CONTEXT_COMPRESS_TRIGGER_MESSAGES:-30}
  CONTEXT_COMPRESS_KEEP_HEAD: ${CONTEXT_COMPRESS_KEEP_HEAD:-4}
  CONTEXT_COMPRESS_KEEP_TAIL: ${CONTEXT_COMPRESS_KEEP_TAIL:-8}
  MEMORY_CURATOR_ENABLED: ${MEMORY_CURATOR_ENABLED:-true}
  MEMORY_CURATOR_MIN_MESSAGES: ${MEMORY_CURATOR_MIN_MESSAGES:-4}
  MEMORY_CURATOR_MAX_ACTIONS: ${MEMORY_CURATOR_MAX_ACTIONS:-6}
  DEBUG: ${DEBUG:-false}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  API_HOST: 0.0.0.0
  API_PORT: 8000
  API_RELOAD: false
  ENFORCE_HTTPS: ${ENFORCE_HTTPS:-true}
  # Only the private Docker bridge may assert X-Forwarded-Proto to the API.
  TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-172.16.0.0/12}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8088}

services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    command:
      - "sh"
      - "-c"
      - "python -c 'from src.utils import config; config.validate_runtime()' && alembic upgrade head"
    restart: "no"
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    command: ["gunicorn", "-c", "gunicorn.conf.py", "src.api.main:app"]
    restart: unless-stopped
    environment:
      <<: *app-env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - app_data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Probe /health/ready, not /health: the liveness endpoint is dependency-free
    # and would report the container healthy while PostgreSQL is unreachable,
    # which is exactly the state a dependent service must not start against.
    # /health/ready returns 503 when the DB (or Redis in rq mode) is down.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/ready', timeout=5).read()\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    command: ["python", "worker.py"]
    restart: unless-stopped
    environment:
      <<: *app-env
    volumes:
      - app_data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # RQ has no HTTP surface, so readiness means "a live worker is registered
      # with Redis" -- the state dependents actually care about. Worker.all()
      # prunes registrations whose heartbeat has expired, so a wedged worker
      # drops out of the list and this fails. That is a weaker guarantee than a
      # real liveness ping, and it is deliberately not claimed to be one.
      test:
        - CMD-SHELL
        - >-
          python -c "import sys; from redis import Redis; from rq import Worker;
          from src.utils import config;
          sys.exit(0 if Worker.all(connection=Redis.from_url(config.REDIS_URL)) else 1)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Without this service an OOM-killed or evicted worker leaves its job
  # `running` forever: nothing else notices that the lease stopped being renewed.
  reaper:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    command: ["python", "-m", "src.jobs.reaper", "--execute", "--loop"]
    restart: unless-stopped
    environment:
      <<: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Replaces the image's HTTP probe, which would mark this container
      # unhealthy forever: the reaper listens on no port. It touches a heartbeat
      # file after every sweep and this checks the file's age instead.
      test: ["CMD", "python", "-m", "src.jobs.reaper", "--healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    restart: unless-stopped
    # Loopback-only by default. A host TLS reverse proxy must expose this
    # service publicly and forward X-Forwarded-Proto: https.
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8088}:80"
    depends_on:
      api:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    command: ["postgres", "-c", "max_connections=${POSTGRES_MAX_CONNECTIONS:-200}"]
    environment:
      POSTGRES_DB: content_ops
      POSTGRES_USER: content_ops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-content_ops}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U content_ops -d content_ops"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-content_ops}"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"${REDIS_PASSWORD:-content_ops}\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  app_data:
  postgres_data:
